# Approach Coverage — evaluation config
#
# Consumed by evaluate.py via EvalConfig.from_yaml(...).
# See CLAUDE.md for the record schema.

# Generation parameters used to produce the generations jsonl. Recorded into every results.jsonl line for
# reproducibility — does NOT trigger sampling here.
generation:
  temperature: 1.0
  top_p: 0.95
  max_tokens: 8192

# Default sample budget per problem (recorded as `n_sampled`).
n_sampled: 64

# Verifier model (vLLM-served, OpenAI-compatible endpoint).
# No rule-based fallback — this is the sole correctness judge.
verifier:
  base_url: "http://localhost:9000/v1"
  model_name: "Qwen/Qwen3-4B"
  max_inflight: 32
  max_retries: 3

# LLM judge clustering (sol_diversity_judge.BatchProcessor).
# Defaults match scripts/cluster_generations.sh.
clustering:
  model: "gpt-5.2"
  mode: "batch"
  reasoning_effort: "none"
  chunk_size: 8
  min_correct: 2
  output_dir: "clustering_responses"

# eval_set name -> problem set jsonl (problem / answer per line).
dataset_sources:
  eval:  "../data/eval.jsonl"
  train: "../data/train.jsonl"

# eval_set name -> sampled solutions jsonl for that problem set
# (problem / answer / solutions / pred per line). Generations are model-specific,
# so either edit these paths per model or pass --generations-file to evaluate.py.
eval_sets:
  eval:  "data/generations/<model>/eval.jsonl"
